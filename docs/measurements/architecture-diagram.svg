<svg viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1180" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">
    iDISCOVR VR Talking Characters — Pipeline
  </text>

  <!-- Client -->
  <g>
    <rect x="30" y="150" width="140" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="100" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">Client</text>
    <text x="100" y="208" text-anchor="middle" font-size="11" fill="#4338ca">Gradio UI /</text>
    <text x="100" y="222" text-anchor="middle" font-size="11" fill="#4338ca">VR headset</text>
  </g>

  <!-- API -->
  <g>
    <rect x="210" y="150" width="140" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="280" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#155e75">API</text>
    <text x="280" y="208" text-anchor="middle" font-size="11" fill="#0e7490">app.py /</text>
    <text x="280" y="222" text-anchor="middle" font-size="11" fill="#0e7490">vr_service.py</text>
  </g>

  <!-- STT -->
  <g>
    <rect x="390" y="150" width="140" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#854d0e">STT</text>
    <text x="460" y="208" text-anchor="middle" font-size="11" fill="#a16207">Whisper</text>
    <text x="460" y="222" text-anchor="middle" font-size="11" fill="#a16207">(faster-whisper)</text>
  </g>

  <!-- LLM -->
  <g>
    <rect x="570" y="150" width="140" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="640" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">LLM</text>
    <text x="640" y="208" text-anchor="middle" font-size="11" fill="#b91c1c">Ollama</text>
    <text x="640" y="222" text-anchor="middle" font-size="11" fill="#b91c1c">(llama3.1:8b)</text>
  </g>

  <!-- TTS -->
  <g>
    <rect x="750" y="150" width="140" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="820" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#166534">TTS</text>
    <text x="820" y="208" text-anchor="middle" font-size="11" fill="#15803d">Kokoro</text>
    <text x="820" y="222" text-anchor="middle" font-size="11" fill="#15803d">(per-sentence)</text>
  </g>

  <!-- Lip-sync -->
  <g>
    <rect x="930" y="150" width="140" height="90" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="1000" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#6b21a8">Lip-sync</text>
    <text x="1000" y="208" text-anchor="middle" font-size="11" fill="#7e22ce">Wav2Lip</text>
    <text x="1000" y="222" text-anchor="middle" font-size="11" fill="#7e22ce">(ONNX, GPU)</text>
  </g>

  <!-- Forward arrows -->
  <line x1="170" y1="195" x2="205" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="195" x2="385" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="195" x2="565" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="195" x2="745" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="195" x2="925" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels on forward arrows -->
  <text x="187" y="180" text-anchor="middle" font-size="10" fill="#6b7280">mic audio</text>
  <text x="367" y="180" text-anchor="middle" font-size="10" fill="#6b7280">audio file</text>
  <text x="547" y="180" text-anchor="middle" font-size="10" fill="#6b7280">transcript</text>
  <text x="727" y="180" text-anchor="middle" font-size="10" fill="#6b7280">text, sentence</text>
  <text x="907" y="180" text-anchor="middle" font-size="10" fill="#6b7280">audio, per line</text>
  <text x="1075" y="180" text-anchor="middle" font-size="10" fill="#6b7280">audio</text>

  <!-- Return path -->
  <path d="M 1000 240 L 1000 320 L 100 320 L 100 245"
        fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="590" y="340" text-anchor="middle" font-size="12" fill="#6b7280">
    voice + lip-synced video URLs (or streamed sentence-by-sentence over SSE)
  </text>

  <!-- Bottom note -->
  <text x="590" y="395" text-anchor="middle" font-size="11" fill="#9ca3af">
    Audio-only characters (Iago, The Cave of Wonders) skip Lip-sync and return audio directly.
  </text>
</svg>
